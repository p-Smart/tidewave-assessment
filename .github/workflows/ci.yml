name: Tidewave Assessment CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Playwright E2E & Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            playwright/package-lock.json
            leads-service/package-lock.json
            ops-console/package-lock.json

      - name: Load pre-built engine image (if present)
        run: |
          if [ -f images/tidewave-engine-1.0.0.tar ]; then
            docker load -i images/tidewave-engine-1.0.0.tar
          fi

      - name: Start Tidewave Docker services
        run: |
          docker compose up -d --wait
        env:
          COMPOSE_INTER_CONTAINER_COMMUNICATION: true

      - name: Wait for services and verify environment
        run: |
          node tools/tw.mjs setup-check

      - name: Start the ops console (needed by the "ops" Playwright project)
        working-directory: ./ops-console
        run: |
          cp .env.local.example .env.local
          npm ci
          nohup npm run dev > ../ops-console.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:7300/login > /dev/null && break; sleep 2; done
          curl -sf http://localhost:7300/login > /dev/null

      - name: Leads service unit tests (LS-001, LS-006, LS-010 reproductions)
        working-directory: ./leads-service
        run: |
          npm ci
          npm test

      - name: Install Playwright test dependencies
        working-directory: ./playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E Test Suite (Positive & Negative Cases)
        working-directory: ./playwright
        run: |
          # Executes storefront, ops console, and api test suites including negative & boundary cases
          npx playwright test
        env:
          CI: true

      - name: Upload Playwright Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright/playwright-report/
          retention-days: 14

      - name: Upload Playwright Traces & Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: playwright/test-results/
          retention-days: 14
